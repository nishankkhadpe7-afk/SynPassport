name: "SynPassport Verification Gate"
description: "Verifies Evidence Passport signatures, dataset hashes, and purpose-bound approval status"
inputs:
  dataset:
    description: "Path to the synthetic dataset file"
    required: true
  passport:
    description: "Path to the Evidence Passport JSON file"
    required: true
  purpose:
    description: "Intended use to verify against policy verdicts"
    required: true
  allow-warning:
    description: "Permit WARNING status as acceptable for intended use"
    required: false
    default: "false"
  public-key:
    description: >
      Path to the TRUSTED Ed25519 public key of the passport issuer. Keep this key
      somewhere the dataset/passport author cannot change (e.g. a protected branch or secret).
    required: true
  install:
    description: "Install Python and SynPassport from this action's repository"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      if: ${{ inputs.install == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install SynPassport
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}/../../.."

    - name: Run SynPassport Verification
      shell: bash
      # Inputs are passed via environment variables, never interpolated into the script,
      # so values such as the purpose cannot inject shell commands.
      env:
        SP_DATASET: ${{ inputs.dataset }}
        SP_PASSPORT: ${{ inputs.passport }}
        SP_PURPOSE: ${{ inputs.purpose }}
        SP_ALLOW_WARNING: ${{ inputs.allow-warning }}
        SP_PUBLIC_KEY: ${{ inputs.public-key }}
      run: |
        args=(verify "$SP_DATASET" "$SP_PASSPORT" --purpose "$SP_PURPOSE" --public-key "$SP_PUBLIC_KEY")
        if [ "$SP_ALLOW_WARNING" = "true" ]; then
          args+=(--allow-warning)
        fi
        passport "${args[@]}"
