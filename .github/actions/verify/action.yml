name: "SynPassport Verification Gate"
description: "Verifies Evidence Passport signatures, dataset hashes, and purpose-bound approval status"
inputs:
  dataset:
    description: "Path to the synthetic dataset file"
    required: true
  passport:
    description: "Path to the Evidence Passport JSON file"
    required: true
  purpose:
    description: "Intended use to verify against policy verdicts"
    required: true
  allow-warning:
    description: "Permit WARNING status as acceptable for intended use"
    required: false
    default: "false"
  public-key:
    description: "Optional path to Ed25519 public key file"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Run SynPassport Verification
      shell: bash
      run: |
        EXTRA_ARGS=""
        if [ "${{ inputs.allow-warning }}" = "true" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --allow-warning"
        fi
        if [ -n "${{ inputs.public-key }}" ]; then
          EXTRA_ARGS="$EXTRA_ARGS --public-key ${{ inputs.public-key }}"
        fi
        python -m synpassport.cli.main verify "${{ inputs.dataset }}" "${{ inputs.passport }}" --purpose "${{ inputs.purpose }}" $EXTRA_ARGS
