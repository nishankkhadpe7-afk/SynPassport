services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Runs, evidence and the server signing keypair live under DATA_DIR (keys in DATA_DIR/keys)
      - DATA_DIR=/app/data
      - SYNPASSPORT_REPLAY=${SYNPASSPORT_REPLAY:-0}
      - SYNPASSPORT_APPROVER_TOKEN=${SYNPASSPORT_APPROVER_TOKEN:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Empty = provider default (a Groq gsk_ key uses qwen/qwen3.8-27b)
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      - ./data:/app/data
      - ./policies:/app/policies
      - ./replay:/app/replay

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are baked into the browser bundle at build time
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      # Set WEB_PORT=3005 if something else (e.g. Grafana) already uses port 3000
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
