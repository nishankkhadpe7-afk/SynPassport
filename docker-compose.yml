services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/synpassport.db
      - SIGNING_KEY_PATH=/app/keys/ed25519_signing_key.pem
      - GLOBAL_SEED=1234
      - SYNPASSPORT_REPLAY=${SYNPASSPORT_REPLAY:-0}
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./policies:/app/policies
      - ./replay:/app/replay

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
