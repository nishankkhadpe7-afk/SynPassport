[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synpassport"
version = "0.1.0"
description = "Purpose-bound assurance agent for synthetic data issuing signed, hash-bound Evidence Passports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "SynPassport Contributors" }
]
dependencies = [
    "pydantic>=2.8.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "httpx>=0.27.0",
]

[project.scripts]
passport = "synpassport.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synpassport = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end replay-mode tests",
    "property: hypothesis or property-based tests",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
files = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
reportMissingImports = "none"
